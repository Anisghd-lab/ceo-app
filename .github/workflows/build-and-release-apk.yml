name: Build CEO APK & Publish GitHub Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.3.1)'
        required: false
        default: 'v0.3.1'

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend Kernel Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend & run pytest
        working-directory: backend
        env:
          FOUNDRY_BASE_DIR: ${{ runner.temp }}/foundry-runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

  build-android-apk:
    name: Build CEO Android APK & Release
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v0.3.1"
            fi
          fi

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(du -h "$APK_PATH" | awk '{print $1}')"
          ASSET_NAME="ceo-${TAG}-debug.apk"

          NOTES="$(printf '### CEO — 100%% On-Device Autonomous Company OS (%s)\n\n- **Antigravity CLI embarqué** (`agy` ARM64 officiel, sans VPS ni Termux) + **Multi-comptes Google** (sauvegarde, switch instantané, ajout de compte sans révoquer les tokens)\n- **Quotas & Modèles en direct** : barres 5h / Weekly et pourcentage restant par modèle\n- **Navigateur In-App intégré** (OAuth Google loopback + navigation web + fallback Chrome)\n- **Routeur Multi-LLM & Custom Providers** + **Sélecteur de fichiers locaux (`+`)** + **Sandboxes SQLite/PDF/ZIP 100%% locales**\n- **Taille APK** : `%s`\n- **SHA-256** : `%s`\n- **Compilé sur** : GitHub Actions (`ubuntu-latest`)\n' "$TAG" "$SIZE" "$SHA256")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK_PATH}#${ASSET_NAME}" --clobber
            gh release edit "$TAG" --title "${TAG} — CEO (Android APK)" --notes "$NOTES"
          else
            gh release create "$TAG" "${APK_PATH}#${ASSET_NAME}" \
              --title "${TAG} — CEO (Android APK)" \
              --notes "$NOTES"
          fi
