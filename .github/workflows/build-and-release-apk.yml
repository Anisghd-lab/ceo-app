name: Build CEO APK & Publish GitHub Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.9.0)'
        required: false
        default: 'v0.9.0'

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend Kernel Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend & run pytest
        working-directory: backend
        env:
          FOUNDRY_BASE_DIR: ${{ runner.temp }}/foundry-runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

  build-android-apk:
    name: Build CEO Android APK & Release
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android JVM Unit & Integration Tests
        working-directory: android
        run: |
          gradle testDebugUnitTest --no-daemon --console=plain --stacktrace
          grep -h "<testsuite " app/build/test-results/testDebugUnitTest/TEST-*.xml || true

      - name: Compile Debug APK (Persistent Signature)
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/ceo-release.jks"
            export ANDROID_KEYSTORE_PATH="${{ runner.temp }}/ceo-release.jks"
          fi
          gradle assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v0.9.0"
            fi
          fi

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(du -h "$APK_PATH" | awk '{print $1}')"
          ASSET_NAME="ceo-${TAG}.apk"
          UNIQUE_APK="/tmp/${ASSET_NAME}"
          cp "$APK_PATH" "$UNIQUE_APK"

          NOTES="$(printf '### CEO — 100%% On-Device Autonomous Company OS (%s)\n\n- **Choix interactifs en 1 clic (façon ChatGPT)** : lorsque le CEO propose des options ou directions, des cartes cliquables apparaissent directement sous la réponse et envoient votre choix en un tap\n- **Réponses normales brèves et concises** : le CEO répond désormais de façon directe, courte et structurée pour les échanges courants\n- **Contrôles de messages complets** : **Copier** et **Modifier & renvoyer** sur vos messages utilisateur ; **Copier** et **Régénérer** sur les réponses IA\n- **Antigravity CLI embarqué** (`agy` ARM64 officiel) + **Store de 14 plugins** + **Exécution arrière-plan 24/7** + **Mémoire Notion par entreprise**\n- **Taille APK** : `%s`\n- **SHA-256** : `%s`\n- **Compilé sur** : GitHub Actions (`ubuntu-latest`)\n' "$TAG" "$SIZE" "$SHA256")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$UNIQUE_APK" --clobber
            gh release edit "$TAG" --title "${TAG} — CEO (Android APK)" --notes "$NOTES"
          else
            gh release create "$TAG" "$UNIQUE_APK" \
              --title "${TAG} — CEO (Android APK)" \
              --notes "$NOTES"
          fi
