name: Build CEO APK & Publish GitHub Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.11.0)'
        required: false
        default: 'v0.11.0'

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend Kernel Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend & run pytest
        working-directory: backend
        env:
          FOUNDRY_BASE_DIR: ${{ runner.temp }}/foundry-runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

  build-android-apk:
    name: Build CEO Android APK & Release
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android JVM Unit & Integration Tests
        working-directory: android
        run: |
          gradle testDebugUnitTest --no-daemon --console=plain --stacktrace
          grep -h "<testsuite " app/build/test-results/testDebugUnitTest/TEST-*.xml || true

      - name: Compile Debug APK (Persistent Signature)
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/ceo-release.jks"
            export ANDROID_KEYSTORE_PATH="${{ runner.temp }}/ceo-release.jks"
          fi
          gradle assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk.sha256

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v0.11.0"
            fi
          fi

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(du -h "$APK_PATH" | awk '{print $1}')"
          ASSET_NAME="ceo-${TAG}.apk"
          UNIQUE_APK="/tmp/${ASSET_NAME}"
          cp "$APK_PATH" "$UNIQUE_APK"

          NOTES="$(printf '### CEO — 100%% On-Device Autonomous Company OS (%s)\n\n- **Autonomie Ultime Multi-Agents sans pause entre bots** : tous les bots spécialistes (Recherche → **tous les Producteurs** ex. `SheetCraft` + `FormatForge` → Visuels `PixelVault` → QA `VeritasQA` → Launch `PackLaunch` → Mémoire `OmniMemory`) s'\''enchaînent désormais automatiquement de bout en bout sans jamais attendre un message manuel entre deux bots. Cliquer un bot dans la barre latérale ouvre son inspecteur sans détourner le chat du CEO !\n- **Réponse directe aux choix interactifs du CEO depuis les Notifications Android** : chaque question à choix du CEO envoie une notification actionnable avec boutons directs en 1 clic (`1. ...`, `2. ...`, `3. ...`) + bouton **Répondre** (`RemoteInput`) qui lance immédiatement le CEO et toute l'\''équipe en arrière-plan\n- **Rendu Markdown natif riche (`MarkdownChatText`)** : gras, italique, titres propres (zéro `#`/`**`/`*`/backticks bruts), listes, citations, tableaux et **liens fichiers cliquables** ouvrant directement les livrables de la sandbox\n- **Plugin #15 OpenHands Cloud (`app.all-hands.dev`)** : intégration optionnelle de l'\''agent d'\''ingénierie logicielle cloud OpenHands (`openhands_list_conversations`, `openhands_get_status`, `openhands_start_task` avec approbation humaine) pour exécuter des tâches multi-fichiers/Docker/PR GitHub tout en gardant CEO 100%% autonome sur Android\n- **Taille APK** : `%s`\n- **SHA-256** : `%s`\n- **Compilé sur** : GitHub Actions (`ubuntu-latest`)\n' "$TAG" "$SIZE" "$SHA256")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$UNIQUE_APK" --clobber
            gh release edit "$TAG" --title "${TAG} — CEO (Android APK)" --notes "$NOTES"
          else
            gh release create "$TAG" "$UNIQUE_APK" \
              --title "${TAG} — CEO (Android APK)" \
              --notes "$NOTES"
          fi
