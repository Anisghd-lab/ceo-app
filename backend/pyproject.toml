[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-os-backend"
version = "0.1.0"
description = "FoundryOS Universal Autonomous Company Kernel (Zero-Hardcoded, Multi-Sandbox, Android-First)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
